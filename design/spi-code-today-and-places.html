<!doctype html>
<html lang="en" data-palette="neutral" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today and places mock</title>
<style>
:root{--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root{--chrome:#f4f4f5;--sidebar:#efeff1;--surface:#fff;--surface-raised:#f0f0f2;--border:#d4d4d8;--border-soft:#e4e4e7;--text:#27272a;--text-strong:#09090b;--text-muted:#52525b;--accent:#1d7a6c;--accent-text:#1c796b;--accent-surface:#e3f1ed;--error:#b42318;--error-text:#b42318;--error-surface:#fde4e1;--warning:#94560a;--warning-text:#94560a;--warning-surface:#fdf0d5;--success:#15803d;--success-text:#157c3b;--success-surface:#e3f5e8;--upstream:#9a2680;--upstream-text:#9a2680;--upstream-surface:#f8e3f0;--work:#0369a1;--work-surface:#ddeefa;--hover:#e9e9ec;--active:#fff;--on-fill:#fff;--agent:#7e4cba}
:root[data-theme="dark"]{--chrome:#141416;--sidebar:#141416;--surface:#0d0d0f;--surface-raised:#1a1a1d;--border:#27272a;--border-soft:#1d1d20;--text:#e4e4e7;--text-strong:#fafafa;--text-muted:#a1a1aa;--accent:#5cc4b2;--accent-text:#5cc4b2;--accent-surface:#14302b;--error:#fca5a5;--error-text:#fca5a5;--error-surface:#311616;--warning:#fcd34d;--warning-text:#fcd34d;--warning-surface:#2b2410;--success:#6ee7a0;--success-text:#6ee7a0;--success-surface:#10291b;--upstream:#c463aa;--upstream-text:#c463aa;--upstream-surface:#2d1727;--work:#7dd3fc;--work-surface:#0f2533;--hover:#232328;--active:#232328;--on-fill:#0d0d0f;--agent:#c4b5fd}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 var(--font-sans);color:var(--text);background:var(--chrome)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
a{color:inherit}
.muted{color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12px}
/* mock toolbar */
.mt{height:40px;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface-raised);font-size:12px;position:relative;z-index:5}
.mt b{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{padding:3px 9px}
.seg button[aria-pressed="true"]{background:var(--text-strong);color:var(--surface)}
.mt select{font:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.mt .sp{flex:1}
/* app */
.appwrap{overflow-x:auto;height:calc(100% - 40px)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%;min-width:760px}.detail{display:none}
.app.nodetail{grid-template-columns:232px minmax(0,1fr) 0}
.side{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.top{height:44px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;flex:none}
.side .top{font-weight:600;color:var(--text-strong)}
.find{margin:10px 10px 6px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text-muted);display:flex;justify-content:space-between}
.nav{padding:4px 6px}
.nav h4{margin:12px 8px 4px;font-size:11px;font-weight:600;color:var(--text-muted)}
.ni{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:6px}
.ni:hover{background:var(--hover)}
.ni[aria-current="page"]{background:var(--active);box-shadow:0 0 0 1px var(--border);color:var(--text-strong);font-weight:500}
.ni .ic{color:var(--text-muted);text-align:center;font-size:12px}
.cnt{font-size:11px;font-weight:600;min-width:20px;text-align:center;border:1px solid currentColor;border-radius:9px;padding:0 5px;line-height:16px}
.cnt.bad{color:var(--error-text)} .cnt.warn{color:var(--warning-text)} .cnt.ok{color:var(--success-text);border:0}
.cnt.plain{color:var(--text-muted);border:0;font-weight:500}
.foot{margin-top:auto;border-top:1px solid var(--border);padding:8px 14px;font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between}
.centre{background:var(--surface);min-width:0;display:flex;flex-direction:column}
.centre .top{justify-content:space-between}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--text-muted)} .crumbs b{color:var(--text-strong);font-weight:600}
.capsule{display:flex;gap:10px;border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--text-muted)}
.capsule .bad{color:var(--error-text)}
.scroll{overflow:auto;flex:1;position:relative}
.xp{margin:0 6px 8px 118px;padding:10px 14px 12px;border-left:2px solid var(--accent);background:var(--surface-raised);border-radius:0 8px 8px 0}
.xp .kick{margin:0 0 4px}.xp .fl:first-child,.xp .kick+.fl,.xp .dmeta+.fl{margin-top:4px}.xp .act{margin-top:10px}
.pop{position:absolute;z-index:20;width:420px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px 14px}
.pop .x{position:absolute;right:8px;top:6px;color:var(--text-muted);font-size:16px;line-height:1}
.nr{font-size:11px;color:var(--warning-text);margin-right:6px;white-space:nowrap}.nr:hover{text-decoration:underline}
.capsule .swept{cursor:pointer}.capsule .swept:hover{color:var(--text-strong);text-decoration:underline}
.evback{font-size:12px;color:var(--text-muted);margin-bottom:6px}.evback:hover{color:var(--text-strong)}
.page{max-width:960px;padding:18px 24px 48px}
h1{font-size:20px;margin:0;font-weight:600;color:var(--text-strong)}
h2{font-size:12px;font-weight:600;color:var(--text-muted);margin:22px 0 6px;display:flex;gap:8px;align-items:baseline}
h2 .n{color:var(--text-strong)}
.lede{margin:4px 0 0;color:var(--text-muted)}
/* status line used by every place */
.status{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-top:6px}
.status .word{font-weight:600}
.tone-bad{color:var(--error-text)} .tone-warn{color:var(--warning-text)} .tone-ok{color:var(--success-text)} .tone-work{color:var(--work)} .tone-up{color:var(--upstream-text)}
.foryou{display:inline-flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--border);border-radius:999px;padding:1px 4px 1px 9px}
.foryou button{padding:0 6px;border-radius:999px} .foryou button:hover{background:var(--hover)}
/* verb lines */
.vl{display:grid;grid-template-columns:108px minmax(0,1fr) 124px 74px;gap:0 10px;align-items:start;padding:8px 6px;border-radius:7px;border-top:1px solid var(--border-soft)}
.vl:first-of-type{border-top:0}
.vl:hover{background:var(--surface-raised)}
.vl.sel{background:var(--accent-surface)}
.rk{font:600 11px var(--font-mono);padding-top:1px}
.rk.p0{color:var(--error-text)} .rk.p1{color:var(--warning-text)}
.verb{font-weight:600;color:var(--accent-text)}
.subj{font-weight:600;color:var(--text-strong);text-align:left;overflow-wrap:anywhere}.subj:hover{text-decoration:underline}
.what{min-width:0}.what .sayb{color:var(--text)}
.when{position:relative;display:inline-flex;vertical-align:-2px;margin-right:5px;color:var(--warning-text);cursor:help}.when svg{width:14px;height:14px;fill:currentColor}
.when:hover::after,.when:focus::after{content:attr(data-tip);position:absolute;right:-6px;bottom:calc(100% + 6px);text-align:left;width:max-content;max-width:240px;white-space:normal;padding:5px 8px;border-radius:6px;background:var(--text-strong);color:var(--surface);font-size:12px;line-height:1.35;z-index:5;pointer-events:none}
.tmem{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:6px}.tm{display:inline-flex;gap:5px;align-items:center}.tm>button{color:var(--text-muted)}.tm>button:hover{color:var(--text-strong);text-decoration:underline}.tm.sel>button{color:var(--text-strong);font-weight:600}
.lk{min-width:0}
.vh .age{padding-top:0}.vh{align-items:end;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding-top:2px;padding-bottom:4px}.vh:hover{background:none}
.say{min-width:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.sayb{color:var(--text-muted);text-align:left}.sayb b{color:var(--text-strong);font-weight:600}.sayb:hover{color:var(--text)}.sayb:hover b{text-decoration:underline}
.say .mem{flex-basis:100%;margin-top:2px}
.verb:hover{text-decoration:underline}
.mem{display:flex;flex-direction:column;gap:3px;min-width:0}
.mem.compact{flex-direction:row;flex-wrap:wrap;gap:3px 12px}
.m{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline;min-width:0}
.m>button{min-width:0}
.mem.compact .m>button{white-space:nowrap}
.m>button:hover .svc{text-decoration:underline}
.m.sel .svc{background:var(--accent-surface);border-radius:3px}
.svc{font-weight:500;color:var(--text-strong)}
.why{color:var(--text-muted)}
.due{font-size:11px;color:var(--warning-text);border:1px solid currentColor;border-radius:4px;padding:0 4px;white-space:nowrap}
.age{white-space:nowrap;color:var(--text-muted);font-variant-numeric:tabular-nums;text-align:right;font-size:12px;padding-top:1px}
.home{font-size:12px;color:var(--text-muted);text-align:right;padding-top:1px;white-space:nowrap}
.home:hover{color:var(--text-strong);text-decoration:underline}
.src{display:inline-flex;gap:4px;align-items:center;font-size:12px;line-height:18px;color:var(--accent-text);text-decoration:none;white-space:nowrap;border:1px solid currentColor;border-radius:999px;padding:0 7px}
.src svg{width:12px;height:12px;fill:currentColor;flex:none}
.src.k-issue{color:var(--work)}.src.k-other{color:var(--text-muted)}
.src:hover{background:var(--accent-surface)}
.src i{font-style:normal;font-size:10px;opacity:.7}
.src.gl{color:var(--upstream-text)} .src.gl:hover{background:var(--upstream-surface)}
.quiet{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:6px;border-top:1px solid var(--border-soft);color:var(--text-muted)}
.quiet:first-of-type{border-top:0}
.quiet b{color:var(--text);font-weight:500}
.calm{padding:18px 0 6px;font-size:15px;color:var(--text-strong)}
.calm small{display:block;font-size:13px;color:var(--text-muted);margin-top:4px}
.box{border:1px solid var(--border);border-radius:9px;padding:4px 8px;container-type:inline-size}
.box-bad{border-color:color-mix(in srgb,var(--error) 45%,var(--border));background:color-mix(in srgb,var(--error-surface) 35%,transparent)}
h2.sh-bad,h2.sh-warn,h2.sh{display:flex;align-items:center;gap:7px}
h2.sh-wait i{background:var(--text-muted)}h2.sh-move i{background:var(--work)}h2.sh-past i{border:1.5px solid var(--text-muted)}
.vl.ctx{cursor:pointer}.vl.ctx>.subj{font-weight:500;color:var(--text)}.vl.ctx>.what{grid-column:2/4}.vl.ctx>.go{grid-column:4;color:var(--text-muted)}.vl.ctx:hover>.subj{text-decoration:underline}.vl.ctx>.what{color:var(--text-muted)}
.box-past{border-style:dashed}h2 i{width:8px;height:8px;border-radius:50%;flex:none}
h2.sh-bad{color:var(--error-text)}h2.sh-bad i{background:var(--error)}h2.sh-warn{color:var(--warning-text)}h2.sh-warn i{background:var(--warning)}
.vl>.subj{grid-column:1;grid-row:1}.vl>.what{grid-column:2;grid-row:1/span 2}.vl>.lk{grid-column:3;grid-row:1}.vl>.age{grid-column:4;grid-row:1}.vl>.home{grid-column:5;grid-row:1}
.vl.grp{padding-bottom:2px}
.vl.sub{border-top:0;padding-top:2px;padding-bottom:2px}.vl.sub>.subj{font-weight:400;color:var(--text-muted);padding-left:12px}.vl.sub>.subj:hover{color:var(--text-strong)}.vl.sub.sel>.subj{color:var(--text-strong);font-weight:600}
.vl.sub+.vl:not(.sub){margin-top:4px}
@container (max-width: 520px){.vl{grid-template-columns:100px minmax(0,1fr) 112px 48px}}
/* Line sheet */
.plan{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--text-muted);margin:10px 0 4px}
.plan b{color:var(--text);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:1px 9px}
.chip[aria-pressed="true"]{background:var(--text-strong);color:var(--surface);border-color:var(--text-strong)}
table.sheet{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;table-layout:fixed}
.sheet col.f{width:118px}
.sheet th{font-weight:600;color:var(--text-muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);font-size:11px}
.sheet td{padding:0;border-bottom:1px solid var(--border-soft)}
.sheet td.svcn{padding:6px;font-weight:500;color:var(--text-strong);white-space:nowrap}
.cell{display:flex;gap:5px;align-items:baseline;width:100%;padding:6px;border-radius:5px;min-height:30px;position:relative}
.cell:hover{background:var(--hover)}
.cell.sel{background:var(--accent-surface);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .g{width:12px;text-align:center;flex:none;font-weight:700}
.cell .t{overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;line-height:1.3}
.cell.mine::after{content:"";position:absolute;right:4px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cell.dim{opacity:.35}
.g-stopped{color:var(--error-text)} .g-unread{color:var(--text-muted)} .g-failed{color:var(--error-text)} .g-person{color:var(--warning-text)} .g-progress{color:var(--work)} .g-clock{color:var(--text-muted)} .g-ready{color:var(--text-muted)}
.fold{padding:6px;color:var(--text-muted);font-size:12px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--text-muted);margin-top:10px}
/* tiles and timelines */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.tile .l{font-size:11px;color:var(--text-muted)} .tile .f{font-size:18px;font-weight:600;color:var(--text-strong);font-variant-numeric:tabular-nums} .tile .s{font-size:12px;color:var(--text-muted)}
.tl{position:relative;margin-top:4px}
.tlr{display:grid;grid-template-columns:80px 1fr;align-items:center;height:28px;border-bottom:1px solid var(--border-soft)}
.tlr .ln{font-size:12px;color:var(--text-muted)}
.track{position:relative;height:100%}
.ev{position:absolute;top:6px;height:16px;border-radius:4px;min-width:8px;font-size:10px;line-height:16px;padding:0 4px;overflow:hidden;white-space:nowrap;color:var(--on-fill)}
.ev.ok{background:var(--success)} .ev.failed{background:var(--error)} .ev.held{background:var(--warning)}
.ev.sel{outline:2px solid var(--accent);outline-offset:1px}
.axis{display:grid;grid-template-columns:80px 1fr;font-size:10px;color:var(--text-muted)}
.axis div:last-child{display:flex;justify-content:space-between}
.bars{display:grid;grid-template-columns:80px 1fr 120px;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--success)}
/* rollout */
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px;margin-top:8px}
.rung{border:1px solid var(--border);border-radius:6px;padding:6px 4px;text-align:center;font-size:11px;min-height:54px}
.rung b{display:block;font-size:11px;font-weight:500;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rung.done{background:var(--success-surface)} .rung.merged{background:var(--work-surface)} .rung.todo{background:transparent}
.rung.sel{box-shadow:0 0 0 2px var(--accent)}
.rung{position:relative}.rung.mine::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.rung .w{display:block;color:var(--text-muted);font-size:10px;margin-top:2px}
.stagekey{display:flex;gap:14px;font-size:12px;margin-top:8px}
.stagekey span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c);border:1px solid var(--border)}
table.repos{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.repos th{text-align:right;font-size:11px;color:var(--text-muted);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--border)}
.repos th:first-child{text-align:left}
.repos td{padding:0;border-bottom:1px solid var(--border-soft)}
.repos .rr{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 108px;column-gap:10px;width:100%;padding:6px 8px}
.repos .rr:hover{background:var(--hover)}
.repos .rr span{text-align:right;font-variant-numeric:tabular-nums}
.repos .rr span:first-child{text-align:left;font-weight:500;color:var(--text-strong)}
.repos .z{color:var(--text-muted)}
.lines{padding:2px 8px 8px 22px}
.lines .sh{font-size:11px;font-weight:600;color:var(--text-muted);margin:6px 0 2px}
.lr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;gap:8px;padding:3px 6px;border-radius:5px;width:100%}
.lr:hover{background:var(--hover)} .lr.sel{background:var(--accent-surface)}
.lr .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* detail */
.detail{background:var(--surface);border-left:1px solid var(--border);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:2px}
.tabs button{padding:4px 10px;border-radius:6px;color:var(--text-muted)}
.tabs button[aria-selected="true"]{background:var(--surface-raised);color:var(--text-strong);font-weight:500}
.dbody{padding:14px 16px 40px;overflow:auto;flex:1}
.kick{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--text-muted)}
.kick button:hover{color:var(--text-strong);text-decoration:underline}
.dt{font-size:16px;font-weight:600;color:var(--text-strong);margin:4px 0 2px}
.dmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--text-muted)}
.fl{margin-top:12px}
.fl .k{display:none}.fl.eff .v{color:var(--text-muted)}
.dmeta .ck{width:12px;height:12px;fill:currentColor;vertical-align:-2px;margin-right:4px}
.lk2{color:var(--accent-text)}.lk2:hover{text-decoration:underline}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.acts .btn{font-size:12.5px;line-height:18px;padding:1px 10px;border-radius:999px;font-weight:500;background:transparent;color:var(--text)}
.acts .btn.primary{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent-text,var(--accent));font-weight:600}
.acts .btn.primary::before{content:"▸";margin-right:5px;font-size:10px;opacity:.8}
.acts .btn.primary[data-url]::before{content:none}
.acts .btn.primary:hover{background:color-mix(in srgb,var(--accent) 24%,transparent);filter:none}
.rule{font-size:12px;margin-top:4px}
.fl .v{margin-top:1px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid var(--border);border-radius:7px;padding:5px 11px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}
.btn:hover{filter:brightness(.97)}
.btn .why{display:block;font-weight:400;font-size:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.steps{margin:2px 0 0;padding-left:18px}.steps li{margin:3px 0}.steps li.now{font-weight:500;color:var(--text-strong)}
.ontoday{display:inline-flex;gap:4px;font-size:11px;border:1px solid var(--accent);color:var(--accent-text);border-radius:999px;padding:0 7px;white-space:nowrap}
.ontoday:hover{background:var(--accent-surface)}
.kick2{margin-top:3px}
.cw{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:6px;border-top:1px solid var(--border-soft);color:var(--text-muted)}
.cw:first-of-type{border-top:0}.cw b{color:var(--text);font-weight:500}
.ro{font-size:11px;color:var(--text-muted);margin-left:4px}
.notread{color:var(--warning-text)}
.dsec{margin-top:18px}
.dsec h5{margin:0 0 4px;font-size:11px;font-weight:600;color:var(--text-muted)}
.sr{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:6px;align-items:baseline;padding:4px 6px;border-radius:5px;width:100%;text-decoration:none}
.sr:hover{background:var(--hover)}
.sr .ki{color:var(--text-muted);font-size:11px;text-align:center}
.sr .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .ar{color:var(--accent-text);font-size:12px}
.sr.gl .ar{color:var(--upstream-text)}
.rel{display:block;width:100%;padding:4px 6px;border-radius:5px}
.rel:hover{background:var(--hover)}
.echip{margin-top:18px;display:flex;justify-content:space-between;gap:8px;font-size:12px;border:1px solid var(--border);border-radius:7px;padding:6px 9px;width:100%}
.echip:hover{background:var(--hover)}
.empty{color:var(--text-muted);padding:30px 4px}
.area{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:6px 0;border-top:1px solid var(--border-soft)}
.area:first-of-type{border-top:0}
.area .st{font-size:12px} .area .rd{grid-column:1/3;font-size:12px;color:var(--text-muted)}
/* toast and walkthrough */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--text-strong);color:var(--surface);border-radius:9px;padding:10px 14px;font-size:12px;max-width:640px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;z-index:20}
.toast b{display:block;font-size:13px}
.toast .u{font-family:var(--font-mono);font-size:11px;opacity:.85;word-break:break-all}
.cap{position:fixed;right:400px;top:52px;width:330px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none;z-index:15}
.cap b{display:block;color:var(--accent-text);margin-bottom:2px}
.cap .nx{margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

function rline(key) { const [name, id] = key.split("|"); const repo = D.repos.find(r => r.name === name); for (const s of repo.sections) { const f = s.lines.find(l => l.id === id); if (f) return { ...f, section: s.title, repo: name }; } }

/* ---------- Evidence ---------- */
const READ_NAME = o => ({ "fork-runs": "Workflow runs on the fork", "actions/variables": "Actions variables", "approvals": "Approvals", "auth": "Sign-in", "port PRs": "Port pull requests", "security": "Security alerts" })[o] || o.replace(/^main:/, "main · ").replace(/^files:repos\/[^/]+\/[^/]+\/compare\/(\w{7})\w*\.\.\.(\w{7})\w*/, "compare $1…$2").replace(/^merge_requests\/(\d+)\/diffs$/, "MR !$1 diff");
const AREA_NAME = { fleet: "Fleet stations", github: "GitHub issues and PRs", runs: "Workflow runs", approvals: "Approvals", lifecycle: "Environment lifecycle", details: "Check and job details", upstream: "Upstream (GitLab)", radar: "Upstream toolchain changes", template: "Template", auth: "Sign-in", security: "Security alerts" };
function evidenceFor(sel) {

    const i = itemById(sel.id); const m = memberOf(sel.id); svc = i.service; title = m ? (m.first ? `${i.service}: upgrade, then review` : i.title) : i.title; areas = i.prov; attributed = "item";
    gl = /^(halt|radar|port):/.test(i.id) || !!(m && m.first);
    if (/could not read its job/.test(i.next || "")) notRead.push("The Validation Summary job: SPI Code could not read it. Its log is only on GitHub.");
    if (/has not been read/.test(i.cause || "")) notRead.push("The deployment failure's cause: the record says it failed, not why.");
    if (m && m.blocker) notRead.push("Whether the other lanes have drained: read at the next sweep.");
  } else if (sel.type === "line") { const l = lineByKey(sel.key); title = l.short; areas = [...new Set(l.members.flatMap(m => m.item.prov))]; attributed = "item"; notRead = [...new Set(l.members.flatMap(m => evidenceFor({ type: "item", id: m.item.id }).notRead))]; groupReads = l.members.flatMap(m => (D.reads[m.item.service] || []).map(r => ({ ...r, object: m.item.service + " · " + READ_NAME(r.object) }))); }
  else if (sel.type === "cell") { svc = sel.id.split(":")[0]; title = sel.id.replace(":", " · "); areas = ["fleet", "runs"]; attributed = "inferred"; gl = sel.id.endsWith(":upstream");
    const [cs, ct] = sel.id.split(":"); const c = D.stations.find(x => x.service === cs).cells.find(x => x.id === ct);
    if (ST(c) === "stopped" && !membersAt(sel.id).length && !heldBy(cs, ct)) notRead.push("The run behind this stopped station: SPI Code has no item for it and didn't read the run."); }
  else if (sel.type === "rung") { svc = sel.id; title = sel.id + " rollout"; areas = ["template", "runs"]; attributed = "inferred"; }

function evChip(ev) {

}
function selToEv(s) {

function renderEvidence() {

  if (ev.notRead.length) h += `<div class="dsec"><h5>Not read</h5>${ev.notRead.map(t => `<div class="area"><span class="notread">⌀ ${esc(t)}</span></div>`).join("")}</div>`;
  if (ev.reads.length) h += `<div class="dsec"><h5>${ev.svc ? "Reads of Azure/osdu-spi-" + esc(ev.svc) : "Reads of the forks in this row"}</h5>${ev.reads.map(r => `<div class="area"><span class="mono">${esc(READ_NAME(r.object))}</span><span class="st">${fmtTime(r.at)}</span></div>`).join("")}</div>`;
  if (ev.gl) h += `<div class="dsec"><h5>Reads of GitLab ${esc(ev.gl.path)}</h5><div class="area"><span>${ev.gl.count} reads: commits, merge requests and files</span><span class="st">${fmtTime(ev.gl.at)}</span></div></div>`;
  const note = { item: "SPI Code read this item from these areas. It does not yet narrow them per item, so this is the sweep's list.", inferred: "Inferred from what this view shows; SPI Code records no source path for it yet.", path: "From the source paths SPI Code recorded for this view.", sweep: "Every area this sweep read." }[ev.attributed];
  h += `<div class="dsec"><h5>Areas</h5><div class="muted" style="font-size:12px;margin-bottom:4px">${esc(note)}</div>${ev.areas.map(a => { const x = D.areas[a]; return x ? `<div class="area"><span>${esc(AREA_NAME[a] || a)}</span><span class="st ${x.state === "fresh" ? "tone-ok" : "tone-warn"}">${esc(x.state)}</span><span class="rd">observed ${when(x.at)} · ${esc(x.complete)}</span></div>` : `<div class="area"><span>${esc(AREA_NAME[a] || a)}</span><span class="st muted">unknown</span></div>`; }).join("")}</div>`;

/* ---------- frame ---------- */
function renderDetail() {
  const old = $("#pop"); if (old) old.remove();
  const s = state.sel; if (!s || state.view === "evidence") return;
  if (state.view === "today" && (s.type === "line" || (s.type === "item" && !s.via))) return;
  const sel = { cell: `[data-cell="${CSS.escape(s.id || "")}"]`, rung: `[data-rung="${CSS.escape(s.id || "")}"]`, event: `[data-event="${CSS.escape(s.id || "")}"]`, rline: `[data-rline="${CSS.escape(s.id || "")}"]`, item: s.via ? `[data-via="${CSS.escape(s.via)}"]` : `[data-item="${CSS.escape(s.id || "")}"]`, line: `[data-line="${CSS.escape(s.key || "")}"]` }[s.type];
  const anchor = sel && [...document.querySelectorAll("#page " + sel)].find(x => x.offsetParent);
  MODE = "pop";
  const body = s.type === "item" ? (memberOf(s.id) ? detailMember(memberOf(s.id), s.via ? { rline: s.via } : {}) : "") : s.type === "line" ? detailLine(lineByKey(s.key)) : s.type === "cell" ? detailCell(s.id) : s.type === "event" ? detailEvent(s.id) : s.type === "rung" ? detailRung(s.id) : s.type === "rline" ? detailRLine(s.id) : "";

  else { pop.style.top = sc.scrollTop + 12 + "px"; pop.style.right = "12px"; }

  $("#capsule").innerHTML = `<span>Environment ✓</span><span class="${stop ? "bad" : ""}">Forks ${stop ? stop + " stopped" : "✓"}</span><span class="swept" data-ev='${esc(JSON.stringify(state.view === "evidence" ? null : state.sel))}' title="How this sweep read ${state.sel && state.view !== "evidence" ? "what is selected" : "the program"}">Swept ${fmtTime(D.sweptAt)}</span>`;
  $("#page").innerHTML = v === "evidence" ? `<button class="evback" data-nav="${state.back || "today"}">‹ ${esc(placeName(state.back || "today"))}</button><h1>Evidence</h1>${renderEvidence()}` : v === "today" ? renderToday() : v === "line" ? renderLine() : v === "environment" ? renderEnvironment() : v === "engineering" ? renderEngineering() : renderStub(v);

function go(view, focus) {
  if (state.view !== view) state.unfold = false;
  state.view = view; if (view !== "engineering") state.openRepo = null;
  if (focus && view === "line" && !focus.startsWith("col:")) { const svc = focus.split(":")[0]; const st = D.stations.find(s => s.service === svc); if (st && st.cells.every(c => ["ready", "clock"].includes(ST(c))) && !membersAt(focus).length) state.unfold = true; }

}

document.addEventListener("click", e => {

document.addEventListener("keydown", e => {

  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { const b = $(".xp .btn.primary[data-url], #pop .btn.primary[data-url]") || $(".xp [data-url], #pop [data-url]"); if (b) { e.preventDefault(); openURL(b.dataset.url); } }
});
for (const [id, key] of [["#mMorning", "morning"], ["#mTheme", "theme"]]) $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; [...$(id).children].forEach(x => x.setAttribute("aria-pressed", x === b)); state[key] = b.dataset.v; if (key === "morning") { D = b.dataset.v === "calm" ? calmData() : LIVE; state.sel = null; state.unfold = false; } render(); });

function calmData() {
  const c = JSON.parse(JSON.stringify(LIVE));
  c.items = []; c.stopped = [];
  c.stations.forEach(s => s.cells.forEach(x => { x.state = "idle"; x.substate = "ready"; x.text = { upstream: "0 behind", sync: "clean", cascade: "idle", main: "green", release: x.text, lane: "last run ok" }[x.id]; }));

  c.flow.plan = { title: "No sync wave in flight", lines: [] };

/* ---------- walkthroughs ---------- */
const WALKS = [
  { name: "1 · Morning: upgrade first, then review, out to GitHub", steps: [
    ["Today lists only what is yours. Four sync PRs need os-core-common upgraded on the fork first; one row holds all four.", () => go("today")],
    ["Opening the row gives the order for every fork, with the oldest fork's pom.xml one click away.", () => pick({ type: "line", key: "absorb" })],

    ["The path at the top goes to the Line with the cell marked. The cell opens the same content in a popover.", () => { go("line", "unit:sync"); pick({ type: "cell", id: "unit:sync" }); }],
    ["A pill opens GitHub or GitLab, and nothing else does.", () => { const b = [...document.querySelectorAll("#pop [data-url], .xp [data-url]")].find(x => /PR #/.test(x.textContent)); b && b.classList.add("flash"); b && openURL(b.dataset.url); }],
  ] },

  ] },
];
WALKS.forEach((w, n) => { const o = document.createElement("option"); o.value = n; o.textContent = w.name; $("#mWalk").appendChild(o); });

$("#cap").addEventListener("click", e => { if (e.target.id === "wNext") { if (walk.i + 1 < WALKS[walk.n].steps.length) { walk.i++; step(); } else { $("#cap").style.display = "none"; $("#mWalk").value = ""; } } if (e.target.id === "wPrev" && walk.i > 0) { walk.i--; step(); } });
