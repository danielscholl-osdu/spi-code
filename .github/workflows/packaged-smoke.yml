name: Packaged smoke

on:
  push:
    branches: [main, "bead/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/bead/') }}

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"
  VITEST_MAX_WORKERS: "4"

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package / ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            package: mac
          - os: windows-latest
            arch: x64
            package: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm run build
      - name: Build unsigned artifacts and smoke the extracted ZIP
        run: pnpm run package:${{ matrix.package }}
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spi-code-${{ matrix.package }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/package-${{ matrix.package }}/artifacts/*.exe
            build/package-${{ matrix.package }}/artifacts/*.dmg
            build/package-${{ matrix.package }}/artifacts/*.zip
            build/package-${{ matrix.package }}/artifacts/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.package }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/package-${{ matrix.package }}/smoke.json
            build/package-${{ matrix.package }}/runtime.json
          if-no-files-found: error
          retention-days: 30

  check:
    name: check / ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Check (pnpm check, shifted clock and licenses)
        run: bash scripts/check
